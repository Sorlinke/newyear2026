<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Year</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Cormorant+Garamond:wght@300;400;500;600&family=Great+Vibes&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #D4A574;
            --secondary: #F5E6D3;
            --accent: #8B6F47;
            --dark: #2C2416;
            --light: #FEF8F3;
            --rose: #E8B4B8;
        }

        html, body {
            width: 100%;
            height: 100%;
            font-family: 'Cormorant Garamond', serif;
            background: linear-gradient(135deg, var(--light) 0%, var(--secondary) 100%);
            overflow: hidden;
            color: var(--dark);
        }

        /* Decorative floating elements */
        .decoration {
            position: fixed;
            border-radius: 50%;
            opacity: 0.15;
            animation: float 15s ease-in-out infinite;
        }

        .decoration:nth-child(1) {
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, var(--primary), transparent);
            top: -100px;
            left: -100px;
            animation-duration: 20s;
        }

        .decoration:nth-child(2) {
            width: 250px;
            height: 250px;
            background: radial-gradient(circle, var(--rose), transparent);
            top: 20%;
            right: -80px;
            animation-duration: 18s;
            animation-delay: 2s;
        }

        .decoration:nth-child(3) {
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, var(--accent), transparent);
            bottom: -50px;
            left: 30%;
            animation-duration: 22s;
            animation-delay: 4s;
        }

        .decoration:nth-child(4) {
            width: 280px;
            height: 280px;
            background: radial-gradient(circle, var(--primary), transparent);
            bottom: 10%;
            right: 10%;
            animation-duration: 19s;
            animation-delay: 1s;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0) scale(1);
            }
            50% {
                transform: translateY(-30px) scale(1.1);
            }
        }

        /* Main container */
        .main-container {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .content-box {
            background: rgba(255, 248, 243, 0.95);
            border: 2px solid var(--primary);
            border-radius: 20px;
            padding: 4rem 3rem;
            max-width: 700px;
            width: 100%;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
            text-align: center;
            animation: fadeIn 1s ease;
        }

        h1 {
            font-family: 'Great Vibes', cursive;
            font-size: 4rem;
            color: var(--primary);
            margin-bottom: 1.5rem;
            animation: fadeInDown 1s ease;
        }

        .subtitle {
            font-size: 1.5rem;
            color: var(--accent);
            font-weight: 300;
            margin-bottom: 3rem;
            letter-spacing: 1px;
        }

        /* Countdown Timer */
        .countdown-timer {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1.5rem;
            margin: 3rem 0;
        }

        .time-unit {
            background: var(--primary);
            color: var(--light);
            padding: 2rem 1rem;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(212, 165, 116, 0.3);
            transition: transform 0.3s ease;
        }

        .time-unit:hover {
            transform: translateY(-5px);
        }

        .time-number {
            font-size: 2.5rem;
            font-weight: 700;
            font-family: 'Playfair Display', serif;
        }

        .time-label {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 0.5rem;
            opacity: 0.9;
        }

        /* Button */
        .reveal-button {
            display: none;
            margin-top: 2rem;
        }

        .reveal-button.show {
            display: block;
            animation: fadeIn 0.8s ease;
        }

        button {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: var(--light);
            border: none;
            padding: 1.2rem 3.5rem;
            border-radius: 50px;
            font-size: 1.4rem;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Cormorant Garamond', serif;
            font-weight: 600;
            letter-spacing: 1px;
            box-shadow: 0 5px 20px rgba(212, 165, 116, 0.4);
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(212, 165, 116, 0.6);
        }

        button:active {
            transform: translateY(-1px);
        }

        /* Success message */
        .success-message {
            display: none;
            font-family: 'Great Vibes', cursive;
            font-size: 2rem;
            color: var(--primary);
            margin-top: 2rem;
        }

        .success-message.show {
            display: block;
            animation: fadeIn 0.8s ease;
        }

        /* Animations */
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Responsive */
        @media (max-width: 768px) {
            h1 {
                font-size: 2.8rem;
            }
            
            .subtitle {
                font-size: 1.2rem;
            }

            .countdown-timer {
                grid-template-columns: repeat(2, 1fr);
                gap: 1rem;
            }

            .time-unit {
                padding: 1.5rem 0.5rem;
            }

            .time-number {
                font-size: 2rem;
            }

            .content-box {
                padding: 2.5rem 1.5rem;
            }

            button {
                padding: 1rem 2.5rem;
                font-size: 1.2rem;
            }
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 2.2rem;
            }

            .time-number {
                font-size: 1.6rem;
            }

            .time-label {
                font-size: 0.7rem;
            }
        }
    </style>
</head>
<body>
    <!-- Decorative elements -->
    <div class="decoration"></div>
    <div class="decoration"></div>
    <div class="decoration"></div>
    <div class="decoration"></div>

    <!-- Main container -->
    <div class="main-container">
        <div class="content-box">
            <h1>Menunggu Waktu Yang Tepat</h1>
            <p class="subtitle">developer update web ini, jadi kita akan pindah</p>

            <!-- Countdown Timer -->
            <div class="countdown-timer" id="countdownTimer">
                <div class="time-unit">
                    <div class="time-number" id="days">00</div>
                    <div class="time-label">Hari</div>
                </div>
                <div class="time-unit">
                    <div class="time-number" id="hours">00</div>
                    <div class="time-label">Jam</div>
                </div>
                <div class="time-unit">
                    <div class="time-number" id="minutes">00</div>
                    <div class="time-label">Menit</div>
                </div>
                <div class="time-unit">
                    <div class="time-number" id="seconds">00</div>
                    <div class="time-label">Detik</div>
                </div>
            </div>

            <!-- Success message -->
            <p class="success-message" id="successMessage">Waktunya telah tiba! ✨</p>

            <!-- Reveal button -->
            <div class="reveal-button" id="revealButton">
                <button onclick="goToLink()">Lihat Sekarang</button>
            </div>
        </div>
    </div>

    <script>
        // Target date: 31 Desember 2025 jam 21:00
        const targetDate = new Date('2025-12-31T21:00:00').getTime();
        let countdownEnded = false;

        function updateCountdown() {
            const now = new Date().getTime();
            const distance = targetDate - now;

            // Jika countdown sudah selesai
            if (distance < 0 && !countdownEnded) {
                countdownEnded = true;
                
                // Sembunyikan countdown
                document.getElementById('countdownTimer').style.display = 'none';
                
                // Tampilkan pesan dan tombol
                document.getElementById('successMessage').classList.add('show');
                document.getElementById('revealButton').classList.add('show');
                
                return;
            }

            // Hitung sisa waktu
            if (distance >= 0) {
                const days = Math.floor(distance / (1000 * 60 * 60 * 24));
                const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((distance % (1000 * 60)) / 1000);

                // Update display
                document.getElementById('days').textContent = String(days).padStart(2, '0');
                document.getElementById('hours').textContent = String(hours).padStart(2, '0');
                document.getElementById('minutes').textContent = String(minutes).padStart(2, '0');
                document.getElementById('seconds').textContent = String(seconds).padStart(2, '0');
            }
        }

        function goToLink() {
            // GANTI URL INI dengan link tujuan kamu
            window.location.href = 'https://sorlinke.github.io/letter/';
        }

        // Update countdown setiap detik
        setInterval(updateCountdown, 1000);
        
        // Jalankan pertama kali
        updateCountdown();
    </script>
</body>
</html>
